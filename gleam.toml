name = "libduvet"
version = "1.1.0"
description = "Gleam client library for the Duvet API and gateway."
licences = ["Apache-2.0"]
repository = { type = "github", user = "duvetchat", repo = "lib-gleam" }
links = [{ title = "Duvet", href = "https://duvet.chat" }]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
hackney = ">= 4.9.1 and < 5.0.0"
gun = ">= 2.7.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[erlang]
applications = ["hackney", "gun"]
